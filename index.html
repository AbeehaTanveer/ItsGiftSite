<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To My Friend</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              charcoal: "#1C1F26",
              steel: "#3D5A73",
              rust: "#C15A3E",
              olive: "#6B7A4F",
              sand: "#E8E1D0",
              slate: "#545B62",
            },
            fontFamily: {
              display: ['"Oswald"', "sans-serif"],
              body: ['"Inter"', "sans-serif"],
            },
            boxShadow: {
              card: "0 30px 60px -15px rgba(28,31,38,0.45), 0 10px 20px -8px rgba(28,31,38,0.3)",
            },
            keyframes: {
              "float-up": {
                "0%": { transform: "translateY(0) translateX(0) rotate(0deg)", opacity: "0" },
                "8%": { opacity: "0.5" },
                "88%": { opacity: "0.4" },
                "100%": { transform: "translateY(-115vh) translateX(var(--drift, 20px)) rotate(25deg)", opacity: "0" },
              },
              "stamp-pulse": {
                "0%, 100%": { transform: "scale(1)" },
                "50%": { transform: "scale(1.04)" },
              },
            },
            animation: {
              "float-up": "float-up linear infinite",
              "stamp-pulse": "stamp-pulse 2.4s ease-in-out infinite",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-charcoal">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
